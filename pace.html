<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>F1 2026 — Pace Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050507;
    --surface: #0a0a0f;
    --ink: #f0f0fa;
    --ink-muted: rgba(240, 240, 250, 0.55);
    --ink-faint: rgba(240, 240, 250, 0.18);
    --ghost-bg: rgba(240, 240, 250, 0.06);
    --ghost-bd: rgba(240, 240, 250, 0.22);
    --ghost-bd-hi: rgba(240, 240, 250, 0.5);
    --accent: #00d7b6;
    --warn: #ffd166;
    --danger: #ff4d4d;
    --ok: #46d39a;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --t-fast: 180ms;
    --t-med: 320ms;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  body { min-height: 100svh; padding-bottom: env(safe-area-inset-bottom); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-feature-settings: 'tnum'; }

  /* TOP BAR */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px calc(14px + env(safe-area-inset-top)) 18px;
    background: linear-gradient(180deg, rgba(5,5,7,0.97), rgba(5,5,7,0.75));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--ghost-bd);
  }
  .topbar .brand { display: flex; gap: 10px; align-items: center; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; }
  .topbar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .topbar .back { padding: 6px 12px; border: 1px solid var(--ghost-bd); border-radius: 99px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); }
  .topbar .back:hover { background: var(--ghost-bg); }

  /* PAGE */
  .page { max-width: 1100px; margin: 0 auto; padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 36px) 60px; }
  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: clamp(26px, 5vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 0.95; margin-bottom: 6px; }
  .page-head h1 em { font-style: normal; color: var(--ink-muted); }
  .page-head p { color: var(--ink-muted); font-size: 13px; max-width: 60ch; }

  /* METHODOLOGY */
  .method {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--ghost-bg);
    border: 1px solid var(--ghost-bd);
    border-radius: 8px;
    font-size: 10.5px;
    color: var(--ink-muted);
    line-height: 1.5;
  }
  .method b { color: var(--ink); font-weight: 600; }

  /* SUMMARY ROW */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 22px; }
  .summary-card { padding: 12px 14px; background: var(--surface); border: 1px solid var(--ink-faint); border-radius: 10px; }
  .summary-card .k { font-size: 9px; letter-spacing: 0.2em; color: var(--ink-muted); text-transform: uppercase; }
  .summary-card .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .summary-card .sub { font-size: 10px; color: var(--ink-muted); margin-top: 1px; }
  @media (max-width: 720px) { .summary-row { grid-template-columns: repeat(2, 1fr); } }

  /* CONTROLS */
  .controls { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .race-picker { display: flex; gap: 4px; flex-wrap: wrap; }
  .race-pill { padding: 6px 10px; border: 1px solid var(--ghost-bd); border-radius: 99px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
  .race-pill:hover { background: var(--ghost-bg); color: var(--ink); }
  .race-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .sort-toggle { margin-left: auto; display: flex; gap: 4px; align-items: center; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); }
  .sort-toggle select { background: var(--surface); color: var(--ink); border: 1px solid var(--ghost-bd); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 11px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; border: 1px solid var(--ghost-bd); border-radius: 10px; background: var(--surface); }
  table.pace { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 12.5px; }
  table.pace th { text-align: left; padding: 10px 12px; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; border-bottom: 1px solid var(--ghost-bd); background: rgba(255,255,255,0.02); white-space: nowrap; position: sticky; top: 0; }
  table.pace td { padding: 11px 12px; border-bottom: 1px solid var(--ink-faint); }
  table.pace tr:last-child td { border-bottom: 0; }
  table.pace tr:hover td { background: rgba(255,255,255,0.025); }

  .cell-team { display: flex; align-items: center; gap: 10px; }
  .cell-team .swatch { width: 4px; height: 22px; border-radius: 2px; background: var(--team-color, var(--accent)); flex-shrink: 0; }
  .cell-team .name { font-weight: 700; }
  .cell-num { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-feature-settings: 'tnum'; letter-spacing: -0.01em; text-align: right; }
  .cell-pos { font-weight: 700; }
  .cell-pos.p1 { color: var(--accent); }
  .cell-pos.p2 { color: var(--ink-muted); }
  .cell-pos.p3 { color: #cd7f32; }
  .cell-delta { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-feature-settings: 'tnum'; text-align: right; font-size: 12px; }
  .delta-good { color: var(--ok); }
  .delta-bad { color: var(--warn); }
  .delta-worse { color: var(--danger); }

  .cell-status { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .cell-status.dnf { color: var(--danger); }
  .cell-status.lap { color: var(--warn); }
  .cell-status.finished { color: var(--ok); }

  /* SEASON VIEW */
  .view-season .team-block { border: 1px solid var(--ghost-bd); border-radius: 10px; background: var(--surface); margin-bottom: 10px; overflow: hidden; }
  .team-block-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--ghost-bd); background: rgba(255,255,255,0.02); flex-wrap: wrap; }
  .team-block-head .swatch { width: 5px; height: 26px; border-radius: 2px; background: var(--team-color, var(--accent)); }
  .team-block-head .name { font-size: 15px; font-weight: 800; }
  .team-block-head .stats { margin-left: auto; display: flex; gap: 14px; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); flex-wrap: wrap; }
  .team-block-head .stats b { color: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .team-block-body { padding: 0; }
  .round-row { display: grid; grid-template-columns: 50px 1fr 95px 80px 95px 80px; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--ink-faint); font-size: 12px; align-items: center; }
  .round-row:last-child { border-bottom: 0; }
  .round-row .r { font-weight: 700; color: var(--accent); font-size: 10px; letter-spacing: 0.12em; }
  .round-row .race { color: var(--ink-muted); font-size: 11px; }
  .round-row .pace, .round-row .qualy, .round-row .best, .round-row .tm { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-feature-settings: 'tnum'; }
  .round-row .grid { font-size: 10px; color: var(--ink-muted); }
  .round-row .tm-cell { font-size: 11px; }
  .round-row .tm-cell .name { color: var(--ink-muted); font-size: 10px; }
  @media (max-width: 720px) {
    .round-row { grid-template-columns: 45px 1fr 75px 70px; font-size: 11px; }
    .round-row .tm, .round-row .qualy { display: none; }
  }

  /* TABS */
  .tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 1px solid var(--ghost-bd); }
  .tab { padding: 9px 14px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span> F1 2026 · Pace Dashboard</div>
    <a class="back" href="./index.html?v=back1">← HOME</a>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>Pace. <em>By team, by race.</em></h1>
      <p>Per-team average race pace, best qualifying time, finishing position — everything an engineer would want at a glance. Tap a team to drill in.</p>
      <div class="method" id="methodology"></div>
    </div>

    <div class="summary-row" id="summary"></div>

    <div class="tabs">
      <button class="tab active" data-view="season">SEASON</button>
      <button class="tab" data-view="round">RACE BY RACE</button>
    </div>

    <section id="view-season" class="view-season"></section>

    <section id="view-round" hidden>
      <div class="controls">
        <div class="race-picker" id="racePicker"></div>
      </div>
      <div class="table-wrap">
        <table class="pace" id="paceTable"></table>
      </div>
    </section>
  </main>

  <script>
    const TEAM_COLORS = {
      mercedes: '#27e0c4', red_bull: '#1e5fb8', ferrari: '#dc0000',
      mclaren: '#ff8000', aston_martin: '#006f62', alpine: '#0090ff',
      williams: '#005aff', rb: '#6692ff', audi: '#bb0a30',
      cadillac: '#8b8d8f', haas: '#b6babd',
    };
    const TEAM_DISPLAY = {
      mercedes: 'Mercedes', red_bull: 'Red Bull', ferrari: 'Ferrari',
      mclaren: 'McLaren', aston_martin: 'Aston Martin', alpine: 'Alpine',
      williams: 'Williams', rb: 'RB', audi: 'Audi',
      cadillac: 'Cadillac', haas: 'Haas',
    };

    let DATA = null;
    let currentRound = null;
    let currentView = 'season';

    async function load() {
      try {
        const r = await fetch('./data/pace-dashboard.json', { cache: 'no-cache' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        DATA = await r.json();
        renderMethodology();
        renderSummary();
        renderRacePicker();
        currentRound = DATA.rounds_covered.at(-1)?.round;
        renderSeason();
        renderRound();
        bindTabs();
      } catch (e) {
        document.getElementById('view-season').innerHTML =
          `<div class="method" style="color:var(--danger)">Could not load pace-dashboard.json: ${e.message}</div>`;
      }
    }

    function renderMethodology() {
      const m = DATA;
      const rounds = m.rounds_covered.length;
      const date = m.generated_utc ? new Date(m.generated_utc).toISOString().slice(0,16).replace('T', ' ') + ' UTC' : '—';
      document.getElementById('methodology').innerHTML =
        `<b>Methodology.</b> ${m.methodology} Coverage: ${rounds} rounds, generated ${date}.`;
    }

    function renderSummary() {
      // Compute season-wide: fastest median pace, most wins, most poles, most DNFs (cross-ref issues)
      const teams = DATA.teams;
      const fastest = [...teams].sort((a, b) => (a.season.avg_pace_delta_to_winner_s ?? 99) - (b.season.avg_pace_delta_to_winner_s ?? 99))[0];
      const mostWins = [...teams].sort((a, b) => b.season.wins - a.season.wins)[0];
      const bestQual = [...teams].sort((a, b) => (a.season.best_qual_s ?? 99) - (b.season.best_qual_s ?? 99))[0];
      const totalWins = teams.reduce((s, t) => s + t.season.wins, 0);
      document.getElementById('summary').innerHTML = `
        <div class="summary-card">
          <div class="k">FASTEST SEASON PACE</div>
          <div class="v" style="color:${TEAM_COLORS[fastest.team_id]}">${TEAM_DISPLAY[fastest.team_id]}</div>
          <div class="sub">${fastest.season.avg_pace_delta_to_winner_s?.toFixed(3) ?? '—'}s avg gap to winner</div>
        </div>
        <div class="summary-card">
          <div class="k">MOST WINS</div>
          <div class="v" style="color:${TEAM_COLORS[mostWins.team_id]}">${TEAM_DISPLAY[mostWins.team_id]}</div>
          <div class="sub">${mostWins.season.wins} of ${DATA.rounds_covered.length} races</div>
        </div>
        <div class="summary-card">
          <div class="k">BEST QUALIFYING</div>
          <div class="v" style="color:${TEAM_COLORS[bestQual.team_id]}">${TEAM_DISPLAY[bestQual.team_id]}</div>
          <div class="sub">${bestQual.season.best_qual_str ?? '—'} best of season</div>
        </div>
        <div class="summary-card">
          <div class="k">TOTAL RACE WINS</div>
          <div class="v">${totalWins}</div>
          <div class="sub">across ${DATA.rounds_covered.length} rounds</div>
        </div>
      `;
    }

    function renderRacePicker() {
      const picker = document.getElementById('racePicker');
      picker.innerHTML = DATA.rounds_covered.map(r =>
        `<button class="race-pill ${r.round === currentRound ? 'active' : ''}" data-round="${r.round}">R${r.round} · ${shortName(r.name)}</button>`
      ).join('');
      picker.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          currentRound = parseInt(b.dataset.round, 10);
          picker.querySelectorAll('button').forEach(x => x.classList.toggle('active', parseInt(x.dataset.round, 10) === currentRound));
          renderRound();
        };
      });
    }

    function shortName(name) {
      return name.replace(' Grand Prix', '').replace(' GP', '');
    }

    function renderSeason() {
      const root = document.getElementById('view-season');
      const teamsSorted = [...DATA.teams].sort((a, b) =>
        (a.season.avg_pace_delta_to_winner_s ?? 99) - (b.season.avg_pace_delta_to_winner_s ?? 99)
      );
      root.innerHTML = teamsSorted.map(team => {
        const color = TEAM_COLORS[team.team_id] || '#888';
        const s = team.season;
        return `
          <div class="team-block">
            <div class="team-block-head" style="--team-color: ${color}">
              <span class="swatch"></span>
              <span class="name">${TEAM_DISPLAY[team.team_id] || team.team_id}</span>
              <div class="stats">
                <span>PACE Δ <b>${s.avg_pace_delta_to_winner_s?.toFixed(3) ?? '—'}s</b></span>
                <span>TM Δ <b>${s.avg_teammate_delta_s != null ? s.avg_teammate_delta_s.toFixed(2) + 's' : '—'}</b></span>
                <span>QUALY <b>${s.best_qual_str ?? '—'}</b></span>
                <span>WINS <b>${s.wins}</b> · POD <b>${s.podiums}</b></span>
                <span>MED P<b>${s.median_position ?? '—'}</b></span>
              </div>
            </div>
            <div class="team-block-body">
              ${s.by_round.map(r => {
                const rankedDrivers = [...r.drivers].sort((a, b) =>
                  (a.pace_avg_s ?? 999) - (b.pace_avg_s ?? 999));
                // Team-level: median (or better) pace, best Q
                const teamPace = rankedDrivers[0]?.pace_avg_s;
                const teamDelta = rankedDrivers[0]?.pace_delta_to_winner_s;
                const teamPos = rankedDrivers[0]?.pos;
                const dClass = teamDelta == null ? '' :
                               teamDelta < 0.5 ? 'delta-good' :
                               teamDelta < 1.5 ? 'delta-bad' : 'delta-worse';
                const tmText = r.teammate_faster
                  ? `<span class="name">${r.teammate_faster.split(' ').slice(-1)[0]}</span> +${r.teammate_delta_s.toFixed(2)}s`
                  : '<span class="name">—</span>';
                const qualyText = r.best_q_pos ? `P${r.best_q_pos}${r.best_q_gap_to_pole_s > 0 ? ' (+' + r.best_q_gap_to_pole_s.toFixed(2) + 's)' : ''}` : '—';
                return `
                  <div class="round-row">
                    <span class="r">R${r.round}</span>
                    <span>
                      <b>P${teamPos ?? '—'}</b> ${r.race.replace(' Grand Prix', ' GP')}
                      <div class="race">${rankedDrivers.map(d => `${d.driver_name.split(' ').slice(-1)[0]} P${d.pos ?? '—'}${d.status === 'Finished' ? '' : ' ' + d.status}`).join(' · ')}</div>
                    </span>
                    <span class="pace">${teamPace != null ? teamPace.toFixed(3) + 's' : '—'}</span>
                    <span class="tm tm-cell">${tmText}</span>
                    <span class="qualy">${qualyText}</span>
                    <span class="cell-delta ${dClass}">${teamDelta != null ? (teamDelta >= 0 ? '+' : '') + teamDelta.toFixed(2) + 's' : '—'}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRound() {
      const rnd = DATA.rounds_covered.find(r => r.round === currentRound);
      if (!rnd) return;
      const table = document.getElementById('paceTable');
      // Build flat list of all drivers in this round, sorted by pace
      const all = DATA.teams.flatMap(team => {
        const tr = team.season.by_round.find(r => r.round === currentRound);
        if (!tr) return [];
        return tr.drivers.map(d => ({...d, team_id: team.team_id}));
      }).filter(d => d.pace_avg_s != null);
      all.sort((a, b) => a.pace_avg_s - b.pace_avg_s);

      table.innerHTML = `
        <thead>
          <tr>
            <th>POS</th>
            <th>DRIVER</th>
            <th>TEAM</th>
            <th>GRID</th>
            <th>PACE</th>
            <th>Δ WINNER</th>
            <th>BEST LAP</th>
            <th>QUALY</th>
            <th>Q ΔPOLE</th>
          </tr>
        </thead>
        <tbody>
          ${all.map((d, i) => {
            const dClass = d.pace_delta_to_winner_s == null ? '' :
                           d.pace_delta_to_winner_s < 0.5 ? 'delta-good' :
                           d.pace_delta_to_winner_s < 1.5 ? 'delta-bad' : 'delta-worse';
            const pCls = d.pos === 1 ? 'p1' : d.pos === 2 ? 'p2' : d.pos === 3 ? 'p3' : '';
            return `
              <tr>
                <td class="cell-num"><b>${i+1}</b></td>
                <td><b>${d.driver_name}</b> <span class="cell-status" style="color:var(--ink-faint)">#${d.permanent_number || d.car_number}</span></td>
                <td>
                  <div class="cell-team">
                    <span class="swatch" style="background: ${TEAM_COLORS[d.team_id] || '#888'}"></span>
                    <span class="name">${TEAM_DISPLAY[d.team_id] || d.team_id}</span>
                  </div>
                </td>
                <td class="cell-num">${d.grid ?? '—'}</td>
                <td class="cell-num">${d.pace_avg_s?.toFixed(3)}s</td>
                <td class="cell-delta ${dClass}">${d.pace_delta_to_winner_s >= 0 ? '+' : ''}${d.pace_delta_to_winner_s.toFixed(3)}s</td>
                <td class="cell-num">${d.best_lap_str ?? '—'}</td>
                <td class="cell-num">${d.q_best_str ?? '—'}</td>
                <td class="cell-delta">${d.q_gap_to_pole_s == null ? '—' : (d.q_gap_to_pole_s >= 0 ? '+' : '') + d.q_gap_to_pole_s.toFixed(3) + 's'}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      `;
    }

    function bindTabs() {
      document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
          currentView = t.dataset.view;
          document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
          document.getElementById('view-season').hidden = currentView !== 'season';
          document.getElementById('view-round').hidden = currentView !== 'round';
        };
      });
    }

    load();
  </script>
</body>
</html>
